[package]
name = "pdf_araci"
version = "2.0.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "sync"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
jpeg-encoder = "0.6"
rfd = "0.15"
rayon = "1.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
